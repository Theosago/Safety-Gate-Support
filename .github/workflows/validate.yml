name: Build and validate Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compile WPF and validate isolated data workflows
        run: bash scripts/validate.sh

  windows-build:
    needs: linux-validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Windows desktop app
        run: dotnet build SafetyGateSupport/SafetyGateSupport.csproj -c Release
      - name: Validate Siemens upload and recovery on Windows
        run: dotnet run --project tests/SafetyGateSupport.SiemensValidation/SafetyGateSupport.SiemensValidation.csproj -c Release
      - name: Validate read-only Hokuyo framing and failure handling
        run: dotnet run --project tests/SafetyGateSupport.HokuyoValidation/SafetyGateSupport.HokuyoValidation.csproj -c Release
      - name: Run Windows desktop regression checks
        env:
          SAFETYGATE_PDF_SMOKE_FIXTURE: ${{ github.workspace }}/artifacts/pdf-smoke.pdf
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet run --project tests/SafetyGateSupport.WindowsValidation/SafetyGateSupport.WindowsValidation.csproj -c Release 2>&1 | Tee-Object -FilePath windows-validation.log
          $validationExitCode = $LASTEXITCODE
          Write-Output "Native validation process exit code: $validationExitCode"
          '### Native Windows validation' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content windows-validation.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($validationExitCode -ne 0) {
            $failureTail = "Native process exit code: $validationExitCode`n" + ((Get-Content windows-validation.log -Tail 35) -join "`n")
            $failureTail = $failureTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop validation log (exit $validationExitCode)::$failureTail"
          }
          exit $validationExitCode
      - name: Publish self-contained Windows x64 app
        run: dotnet publish SafetyGateSupport/SafetyGateSupport.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/win-x64
      - name: Publish Siemens USB check tool
        run: dotnet publish tools/SiemensUsbCheck/SiemensUsbCheck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/siemens-usb-check
      - name: Record executable checksum
        shell: pwsh
        run: |
          $artifactHash = (Get-FileHash artifacts/win-x64/SafetyGateSupport.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$artifactHash  SafetyGateSupport.exe" | Set-Content artifacts/win-x64/SafetyGateSupport.exe.sha256 -Encoding ascii
          $usbCheckHash = (Get-FileHash artifacts/siemens-usb-check/SiemensUsbCheck.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$usbCheckHash  SiemensUsbCheck.exe" | Set-Content artifacts/siemens-usb-check/SiemensUsbCheck.exe.sha256 -Encoding ascii
          Copy-Item tools/SiemensUsbCheck/README.md artifacts/siemens-usb-check/README.md
          Copy-Item docs/WINDOWS_QUICK_START.md artifacts/win-x64/README.md
          Copy-Item docs/HOKUYO_USB_DIAGNOSTICS.md artifacts/win-x64/HOKUYO_USB_DIAGNOSTICS.md
      - name: Smoke-test the bundled PDF renderer in the published executable
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP ('pdf-preview-' + [guid]::NewGuid().ToString('N') + '.json')
          $fixturePath = (Resolve-Path artifacts/pdf-smoke.pdf).Path
          $pdfCheck = Start-Process -FilePath (Resolve-Path artifacts/win-x64/SafetyGateSupport.exe) -ArgumentList @('--validate-pdf-preview', ('"' + $fixturePath + '"'), ('"' + $resultPath + '"')) -PassThru
          if (!$pdfCheck.WaitForExit(45000)) { $pdfCheck.Kill(); throw 'Published PDF engine did not finish cleanly.' }
          if ($pdfCheck.ExitCode -ne 0 -or !(Test-Path $resultPath)) { throw "Published PDF engine failed with exit $($pdfCheck.ExitCode)." }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($result.PageCount -ne 2 -or $result.PixelWidth -ne 2000 -or $result.PixelHeight -ne 1000) { throw 'Published PDF rendering returned unexpected dimensions or page count.' }
          Write-Host 'Published executable rendered the PDF using its bundled native libraries and exited cleanly.'
      - name: Smoke-test the normal published app with isolated settings
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('SafetyGateSupport-Smoke-' + [guid]::NewGuid().ToString('N'))
          $sharedRoot = Join-Path $smokeRoot 'Shared'
          Expand-Archive -LiteralPath SafetyGateSupport/SeedData.zip -DestinationPath $sharedRoot
          $settingsPath = Join-Path $env:LOCALAPPDATA 'SafetyGateSupport/settings.json'
          New-Item -ItemType Directory -Path (Split-Path $settingsPath) -Force | Out-Null
          $previousSettings = if (Test-Path $settingsPath) { [IO.File]::ReadAllBytes($settingsPath) } else { $null }
          try {
            @{ SharedRoot = $sharedRoot } | ConvertTo-Json | Set-Content $settingsPath -Encoding utf8
            $app = Start-Process -FilePath (Resolve-Path artifacts/win-x64/SafetyGateSupport.exe) -PassThru
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) { throw 'Published app exited before startup completed.' }
            } until (($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -like 'Safety Gate Support*') -or (Get-Date) -gt $deadline)
            if ($app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -like '*Home Preview*') { throw 'Normal app did not open correctly.' }
            Write-Host 'Normal published app opened with isolated settings and starter inventory.'
          } finally {
            if ($app -and !$app.HasExited) {
              $null = $app.CloseMainWindow()
              if (!$app.WaitForExit(10000)) { $app.Kill(); $app.WaitForExit() }
            }
            if ($null -ne $previousSettings) { [IO.File]::WriteAllBytes($settingsPath, $previousSettings) } else { Remove-Item $settingsPath -ErrorAction SilentlyContinue }
          }
      - name: Upload downloadable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SafetyGateSupport-Windows-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Siemens USB check tool
        uses: actions/upload-artifact@v4
        with:
          name: SiemensUsbCheck-Windows-x64
          path: artifacts/siemens-usb-check/
          if-no-files-found: error
          retention-days: 30
