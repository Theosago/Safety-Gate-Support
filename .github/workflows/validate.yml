name: Build and validate Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compile WPF and validate isolated data workflows
        run: bash scripts/validate.sh

  windows-build:
    needs: linux-validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Windows desktop app
        run: dotnet build SafetyGateSupport/SafetyGateSupport.csproj -c Release
      - name: Validate Siemens upload and recovery on Windows
        run: dotnet run --project tests/SafetyGateSupport.SiemensValidation/SafetyGateSupport.SiemensValidation.csproj -c Release
      - name: Validate read-only Hokuyo framing and failure handling
        run: dotnet run --project tests/SafetyGateSupport.HokuyoValidation/SafetyGateSupport.HokuyoValidation.csproj -c Release
      - name: Run Windows desktop regression checks
        env:
          SAFETYGATE_UI_SNAPSHOTS: ${{ github.workspace }}/artifacts/ui-preview
        shell: pwsh
        run: |
          dotnet run --project tests/SafetyGateSupport.WindowsValidation/SafetyGateSupport.WindowsValidation.csproj -c Release 2>&1 | Tee-Object -FilePath windows-validation.log
          $validationExitCode = $LASTEXITCODE
          '### Native Windows validation' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content windows-validation.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $validationExitCode
      - name: Publish self-contained Windows x64 app
        run: dotnet publish SafetyGateSupport/SafetyGateSupport.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/win-x64
      - name: Publish Siemens USB check tool
        run: dotnet publish tools/SiemensUsbCheck/SiemensUsbCheck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/siemens-usb-check
      - name: Record executable checksum
        shell: pwsh
        run: |
          $artifactHash = (Get-FileHash artifacts/win-x64/SafetyGateSupport.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$artifactHash  SafetyGateSupport.exe" | Set-Content artifacts/win-x64/SafetyGateSupport.exe.sha256 -Encoding ascii
          $usbCheckHash = (Get-FileHash artifacts/siemens-usb-check/SiemensUsbCheck.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$usbCheckHash  SiemensUsbCheck.exe" | Set-Content artifacts/siemens-usb-check/SiemensUsbCheck.exe.sha256 -Encoding ascii
          Copy-Item tools/SiemensUsbCheck/README.md artifacts/siemens-usb-check/README.md
          Copy-Item docs/WINDOWS_QUICK_START.md artifacts/win-x64/README.md
          Copy-Item docs/HOKUYO_USB_DIAGNOSTICS.md artifacts/win-x64/HOKUYO_USB_DIAGNOSTICS.md
      - name: Package and smoke-test home preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/home-preview -Force | Out-Null
          Copy-Item artifacts/win-x64/* artifacts/home-preview/ -Recurse
          Rename-Item artifacts/home-preview/SafetyGateSupport.exe SafetyGateSupportPreview.exe
          Remove-Item artifacts/home-preview/SafetyGateSupport.exe.sha256
          Copy-Item docs/HOME_PREVIEW.md artifacts/home-preview/README.md -Force
          $previewHash = (Get-FileHash artifacts/home-preview/SafetyGateSupportPreview.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$previewHash  SafetyGateSupportPreview.exe" | Set-Content artifacts/home-preview/SafetyGateSupportPreview.exe.sha256 -Encoding ascii
          $normalSettings = Join-Path $env:LOCALAPPDATA 'SafetyGateSupport/settings.json'
          $normalHash = if (Test-Path $normalSettings) { (Get-FileHash $normalSettings).Hash } else { $null }
          $preview = Start-Process -FilePath (Resolve-Path artifacts/home-preview/SafetyGateSupportPreview.exe) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $sample = Join-Path $env:LOCALAPPDATA 'SafetyGateSupport/HomePreview/Data/HomePreview/SampleUnit/LightConfig/Current/DEMO ONLY - not for equipment.signal'
            do {
              Start-Sleep -Milliseconds 250
              $preview.Refresh()
              if ($preview.HasExited) { throw 'Published home preview exited before startup completed.' }
            } until (($preview.MainWindowTitle -like '*Home Preview*' -and (Test-Path $sample)) -or (Get-Date) -gt $deadline)
            if ($preview.MainWindowTitle -notlike '*Home Preview*' -or !(Test-Path $sample)) { throw 'Published home preview did not open its local sample profile.' }
            $afterHash = if (Test-Path $normalSettings) { (Get-FileHash $normalSettings).Hash } else { $null }
            if ($afterHash -ne $normalHash) { throw 'Home preview modified normal app settings.' }
            Write-Host 'Published preview executable opened the local profile and sample without changing normal settings.'
          } finally {
            if (!$preview.HasExited) {
              $null = $preview.CloseMainWindow()
              if (!$preview.WaitForExit(10000)) { $preview.Kill(); $preview.WaitForExit() }
            }
          }
      - name: Upload downloadable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SafetyGateSupport-Windows-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Siemens USB check tool
        uses: actions/upload-artifact@v4
        with:
          name: SiemensUsbCheck-Windows-x64
          path: artifacts/siemens-usb-check/
          if-no-files-found: error
          retention-days: 30
      - name: Upload home preview
        uses: actions/upload-artifact@v4
        with:
          name: SafetyGateSupport-Home-Preview-Windows-x64
          path: artifacts/home-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Upload rendered v7 screens
        uses: actions/upload-artifact@v4
        with:
          name: SafetyGateSupport-V7-Screenshots
          path: artifacts/ui-preview/
          if-no-files-found: error
          retention-days: 30
